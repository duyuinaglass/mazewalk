<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ワールドウォーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E6E8EB;
  --panel: #F5F6F7;
  --ink: #1C222B;
  --muted: #5B6370;
  --line: #C9CED5;
  --accent: #2E5A87;
  --accent-ink: #FFFFFF;
  --rec: #B42318;
  --stage: #0E1013;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171B;
    --panel: #1C2026;
    --ink: #E5E8EC;
    --muted: #9AA2AE;
    --line: #333A44;
    --accent: #86AEDB;
    --accent-ink: #10161D;
    --rec: #F0705F;
    --stage: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171B;
  --panel: #1C2026;
  --ink: #E5E8EC;
  --muted: #9AA2AE;
  --line: #333A44;
  --accent: #86AEDB;
  --accent-ink: #10161D;
  --rec: #F0705F;
  --stage: #000000;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 14px; line-height: 1.6;
}
.app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
.panel {
  background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 20px 20px 32px;
}
.panel header h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.02em; }
.panel header p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 16px; }
h2 { font-size: 14px; margin: 0 0 10px; }
.row { margin-bottom: 10px; }
.row label.top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.row output { color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
#minimap { width: 100%; aspect-ratio: 1; display: block; border: 1px solid var(--line); margin-bottom: 6px; image-rendering: pixelated; cursor: crosshair; }
#heroPreview { display: block; width: 100%; image-rendering: pixelated; background: #4caf3c; border: 1px solid var(--line); margin-bottom: 10px; }
.seed { display: flex; gap: 8px; align-items: center; }
.seed input { flex: 1; min-width: 0; }
input[type="number"], select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px;
}
button, .btn {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px;
  cursor: pointer; white-space: nowrap; display: inline-block;
}
button:hover, .btn:hover { border-color: var(--muted); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.recording { background: var(--rec); color: #FFFFFF; border-color: var(--rec); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.color-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
input[type="color"] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 2px; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.viewport {
  flex: 1; min-height: 0; background: var(--stage);
  display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden;
}
#view { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; background: #000; image-rendering: pixelated; }
.bar {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 13px;
}
.bar .group { display: flex; align-items: center; gap: 8px; }
.bar .group label { color: var(--muted); }
#duration { width: 80px; }
#timer { font-variant-numeric: tabular-nums; min-width: 4.5em; }
#status { color: var(--muted); flex-basis: 100%; min-height: 1.6em; }
@media (max-width: 760px) {
  body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { order: -1; }
  .viewport { padding: 0; height: 56vh; flex: none; }
  .panel { border-right: none; border-top: 1px solid var(--line); overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <h1>ワールドウォーク</h1>
      <p>ドット絵のワールドマップを生成し、主人公たちが町から町へ旅を続ける映像を録画します。</p>
    </header>

    <section>
      <h2>ワールド</h2>
      <canvas id="minimap" width="128" height="128" aria-label="ワールド全体の地図"></canvas>
      <p class="hint">地図をクリックすると、その近くに主人公を移します。マップの端は反対側とつながっています。</p>
      <div class="color-row"><label for="size">広さ</label>
        <select id="size">
          <option value="64">64×64</option><option value="96">96×96</option>
          <option value="128" selected>128×128</option><option value="192">192×192</option><option value="256">256×256</option>
        </select></div>
      <div class="row"><label class="top" for="land">陸の割合<output id="land-out"></output></label>
        <input type="range" id="land" min="15" max="75" step="1"></div>
      <div class="row"><label class="top" for="scale">大陸の細かさ<output id="scale-out"></output></label>
        <input type="range" id="scale" min="1" max="6" step="1"></div>
      <div class="row"><label class="top" for="mount">山の多さ<output id="mount-out"></output></label>
        <input type="range" id="mount" min="0" max="100" step="1"></div>
      <div class="row"><label class="top" for="forest">森の多さ<output id="forest-out"></output></label>
        <input type="range" id="forest" min="0" max="100" step="1"></div>
      <div class="row"><label class="top" for="dry">砂漠の多さ<output id="dry-out"></output></label>
        <input type="range" id="dry" min="0" max="60" step="1"></div>
      <div class="row"><label class="top" for="cold">雪の地域の多さ<output id="cold-out"></output></label>
        <input type="range" id="cold" min="0" max="60" step="1"></div>
      <div class="row"><label class="top" for="swamp">毒の沼地の多さ<output id="swamp-out"></output></label>
        <input type="range" id="swamp" min="0" max="20" step="1"></div>
      <div class="row"><label class="top" for="towns">町や城の多さ<output id="towns-out"></output></label>
        <input type="range" id="towns" min="0" max="100" step="1"></div>
      <div class="row seed">
        <label for="seed" style="font-size:13px">シード</label>
        <input type="number" id="seed">
        <button id="newMap">新しいワールド</button>
      </div>
    </section>

    <section>
      <h2>主人公</h2>
      <canvas id="heroPreview" width="88" height="24" aria-label="主人公の4方向の歩き姿"></canvas>
      <div class="color-row"><label for="preset">職業</label>
        <select id="preset"></select></div>
      <div class="color-row"><label for="head">頭</label>
        <select id="head">
          <option value="hair">髪のみ</option><option value="helmet">兜</option>
          <option value="wizard">とんがり帽子</option><option value="hood">頭巾</option>
        </select></div>
      <label class="check"><input type="checkbox" id="cape">マントを着ける</label>
      <div class="colors">
        <div class="color-row"><label for="c-hair">髪</label><input type="color" id="c-hair"></div>
        <div class="color-row"><label for="c-skin">肌</label><input type="color" id="c-skin"></div>
        <div class="color-row"><label for="c-cloth">服</label><input type="color" id="c-cloth"></div>
        <div class="color-row"><label for="c-capeC">マント</label><input type="color" id="c-capeC"></div>
        <div class="color-row"><label for="c-hat">帽子・兜</label><input type="color" id="c-hat"></div>
        <div class="color-row"><label for="c-boots">靴・帯</label><input type="color" id="c-boots"></div>
      </div>
      <div class="btns">
        <button id="randomHero">色をおまかせ</button>
        <label class="btn">画像を読み込む<input type="file" id="sheetFile" accept="image/*"></label>
        <button id="sheetReset" hidden>画像をやめる</button>
      </div>
      <p class="hint">画像は縦4段（上から下・左・右・上向き）× 横2〜4コマのドット絵を並べたものを読み込めます。1コマは16×16でなくても構いません。</p>
      <div class="color-row"><label for="sheetCols">画像の横のコマ数</label>
        <select id="sheetCols"><option value="0">自動</option><option value="2">2コマ</option><option value="3">3コマ（1-2-3-2と歩く）</option><option value="4">4コマ</option></select></div>
      <div class="row"><label class="top" for="party">仲間の人数<output id="party-out"></output></label>
        <input type="range" id="party" min="0" max="3" step="1"></div>
    </section>

    <section>
      <h2>旅の仕方</h2>
      <div class="row"><label class="top" for="speed">歩く速さ<output id="speed-out"></output></label>
        <input type="range" id="speed" min="1" max="12" step="0.5"></div>
      <div class="row"><label class="top" for="detour">寄り道のしやすさ<output id="detour-out"></output></label>
        <input type="range" id="detour" min="0" max="100" step="1"></div>
      <div class="row"><label class="top" for="rest">町や城で休む時間<output id="rest-out"></output></label>
        <input type="range" id="rest" min="0" max="6" step="0.5"></div>
      <label class="check"><input type="checkbox" id="fade">町や城に入るとき画面を暗転する</label>
    </section>

    <section>
      <h2>表示</h2>
      <div class="row"><label class="top" for="rows">画面の縦のマス数（目安）<output id="rows-out"></output></label>
        <input type="range" id="rows" min="6" max="24" step="1"></div>
      <label class="check"><input type="checkbox" id="anim">海の波や沼を動かす</label>
    </section>
  </aside>

  <main class="stage">
    <div class="viewport"><canvas id="view"></canvas></div>
    <div class="bar">
      <button id="pause">一時停止</button>
      <div class="group"><label for="res">解像度</label>
        <select id="res">
          <option value="640x480">640×480（4:3）</option>
          <option value="960x720">960×720（4:3）</option>
          <option value="1280x720" selected>1280×720（16:9）</option>
          <option value="1920x1080">1920×1080（16:9）</option>
        </select></div>
      <div class="group"><label for="fps">fps</label>
        <select id="fps"><option>24</option><option selected>30</option><option>60</option></select></div>
      <div class="group"><label for="duration">長さ（秒・0で手動停止）</label>
        <input type="number" id="duration" min="0" step="1" value="0"></div>
      <div class="group">
        <button id="rec" class="primary">録画を開始</button>
        <span id="timer">0:00</span>
      </div>
      <button id="save" hidden>動画を保存</button>
      <div id="status" role="status"></div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const TS = 16; // tile size in dots

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(seed, x, y) {
    let h = (seed | 0) ^ Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    h = Math.imul(h ^ (h >>> 15), 2246822519);
    h ^= h >>> 13;
    return (h >>> 0) / 4294967296;
  }
  const mod = (a, n) => ((a % n) + n) % n;
  const wrapD = (d, n) => d - n * Math.round(d / n);

  // ---------- parameters ----------
  const P = {
    size: 128, land: 40, scale: 2, mount: 35, forest: 45, dry: 18, cold: 15, swamp: 4, towns: 40, seed: 1986,
    party: 3, speed: 3.5, detour: 25, rest: 1.5, fade: true, rows: 11, anim: true,
  };
  const fmt = {
    land: (v) => v + "%", scale: (v) => ["", "大きな大陸", "やや大きい", "ふつう", "やや細かい", "細かい", "島だらけ"][v],
    mount: (v) => v + "%", forest: (v) => v + "%", dry: (v) => v + "%", cold: (v) => v + "%", swamp: (v) => v + "%",
    towns: (v) => v + "%", party: (v) => (v == 0 ? "ひとり旅" : v + "人"), speed: (v) => (+v).toFixed(1) + "マス/秒",
    detour: (v) => v + "%", rest: (v) => (v == 0 ? "立ち寄らない" : (+v).toFixed(1) + "秒"), rows: (v) => v + "マス",
  };
  const regenKeys = new Set(["land", "scale", "mount", "forest", "dry", "cold", "swamp", "towns"]);

  // ---------- tile types ----------
  const T = { DEEP: 0, SHALLOW: 1, BEACH: 2, GRASS: 3, FOREST: 4, HILL: 5, MOUNT: 6, SNOWMT: 7, DESERT: 8, SNOW: 9,
    SWAMP: 10, SNOWFOREST: 11, TOWN: 12, CASTLE: 13, CAVE: 14, SHRINE: 15, BRIDGE: 16 };
  const WALK = new Uint8Array(17).fill(1);
  [T.DEEP, T.SHALLOW, T.MOUNT, T.SNOWMT].forEach((t) => (WALK[t] = 0));
  const WATERY = new Uint8Array(17);
  [T.DEEP, T.SHALLOW, T.BRIDGE].forEach((t) => (WATERY[t] = 1));
  const COST = new Float32Array(17).fill(1);
  COST[T.DESERT] = 1.4; COST[T.SNOW] = 1.4; COST[T.FOREST] = 1.8; COST[T.SNOWFOREST] = 1.8; COST[T.HILL] = 2.2; COST[T.SWAMP] = 3.5;
  const POI_TYPES = new Set([T.TOWN, T.CASTLE, T.CAVE, T.SHRINE]);
  const MINI = ["#1f3fa8", "#3f7fe0", "#e8d48a", "#4caf3c", "#1f7a2c", "#8cc84b", "#9a7a54", "#e8e8f0", "#e3c27a", "#eef4fa",
    "#6b4a8a", "#9fb8a8", "#ff4040", "#ffd040", "#202020", "#ff80ff", "#b07a3c"];

  // ---------- world generation ----------
  function pnoise(seed, u, v, c) {
    const x = u * c, y = v * c;
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const xa = mod(x0, c), xb = mod(x0 + 1, c), ya = mod(y0, c), yb = mod(y0 + 1, c);
    const a = hash2(seed, xa, ya), b = hash2(seed, xb, ya), d = hash2(seed, xa, yb), e = hash2(seed, xb, yb);
    return (a + (b - a) * sx) + ((d + (e - d) * sx) - (a + (b - a) * sx)) * sy;
  }
  function fbm(seed, u, v, base, oct) {
    let s = 0, a = 1, t = 0, c = base;
    for (let o = 0; o < oct; o++) { s += a * pnoise(seed + o * 1013, u, v, c); t += a; a *= 0.5; c *= 2; }
    return s / t;
  }
  function quantile(sorted, q) {
    if (!sorted.length) return 0;
    const i = Math.min(sorted.length - 1, Math.max(0, Math.floor(q * sorted.length)));
    return sorted[i];
  }

  function generateWorld(p) {
    const N = p.size, NN = N * N;
    const rng = mulberry32(p.seed * 7919 + 13);
    const seed = p.seed * 31 + 7;
    const base = [0, 2, 3, 4, 5, 6, 8][p.scale];
    const H = new Float32Array(NN), M = new Float32Array(NN), Tm = new Float32Array(NN), R = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let u = x / N, v = y / N;
      const wu = fbm(seed + 900, u, v, base * 2, 3) - 0.5, wv = fbm(seed + 1900, u, v, base * 2, 3) - 0.5;
      const uu = u + wu * 0.12, vv = v + wv * 0.12;
      const i = y * N + x;
      H[i] = fbm(seed, uu, vv, base, 6);
      M[i] = fbm(seed + 5000, uu, vv, base * 2, 4);
      Tm[i] = fbm(seed + 9000, u, v, Math.max(2, base), 3);
      R[i] = 1 - Math.abs(2 * fbm(seed + 13000, uu, vv, base * 2, 4) - 1);
    }
    const hs = Float32Array.from(H).sort();
    const sea = quantile(hs, 1 - p.land / 100);
    const shallowLv = quantile(hs, Math.max(0, 1 - p.land / 100 - 0.05));
    const t = new Uint8Array(NN), baseT = new Uint8Array(NN);
    const landIdx = [];
    for (let i = 0; i < NN; i++) {
      if (H[i] >= sea) { landIdx.push(i); t[i] = T.GRASS; }
      else t[i] = H[i] >= shallowLv ? T.SHALLOW : T.DEEP;
    }
    const nb4 = (i) => { const x = i % N, y = (i / N) | 0; return [y * N + mod(x + 1, N), y * N + mod(x - 1, N), mod(y + 1, N) * N + x, mod(y - 1, N) * N + x]; };
    // shallow water along every coast so islands get a ring
    for (const i of landIdx) for (const j of nb4(i)) if (t[j] === T.DEEP) t[j] = T.SHALLOW;
    const lh = landIdx.map((i) => H[i]).sort((a, b) => a - b);
    const ms = landIdx.map((i) => M[i]).sort((a, b) => a - b);
    const tms = landIdx.map((i) => Tm[i]).sort((a, b) => a - b);
    const mscore = (i) => ((H[i] - sea) / (lh[lh.length - 1] - sea + 1e-6)) * 0.55 + R[i] * 0.45;
    const mss = landIdx.map(mscore).sort((a, b) => a - b);
    const mk = p.mount / 100;
    const qMount = quantile(mss, 1 - mk * 0.32), qHill = quantile(mss, 1 - mk * 0.5), qPeak = quantile(mss, 1 - mk * 0.07);
    const qBeach = quantile(lh, 0.07);
    const qCold = p.cold > 0 ? quantile(tms, p.cold / 100) : -1;
    // deserts favour dry *and* warm ground, and keep a margin from the snow
    const dscore = (i) => (1 - M[i]) + 0.8 * Tm[i];
    const dss = landIdx.map(dscore).sort((a, b) => a - b);
    const qDry = p.dry > 0 ? quantile(dss, 1 - p.dry / 100) : 99;
    const qWarm = p.cold > 0 ? quantile(tms, Math.min(1, p.cold / 100 + 0.12)) : -1;
    const qSwamp = p.swamp > 0 ? quantile(ms, 1 - p.swamp / 100) : 2;
    const qForest = p.forest > 0 ? quantile(ms, Math.max(p.dry / 100, 1 - p.swamp / 100 - (p.forest / 100) * 0.6)) : 2;
    for (const i of landIdx) {
      const cold = Tm[i] < qCold;
      const s = mscore(i);
      const coastal = nb4(i).some((j) => t[j] === T.SHALLOW || t[j] === T.DEEP);
      let ty;
      if (s >= qMount && mk > 0) ty = (s >= qPeak || cold) ? T.SNOWMT : T.MOUNT;
      else if (s >= qHill && mk > 0) ty = T.HILL;
      else if (coastal && H[i] < qBeach && !cold) ty = T.BEACH;
      else if (dscore(i) > qDry && Tm[i] > qWarm) ty = T.DESERT;
      else if (M[i] > qSwamp && !cold) ty = T.SWAMP;
      else if (M[i] > qForest) ty = cold ? T.SNOWFOREST : T.FOREST;
      else ty = cold ? T.SNOW : T.GRASS;
      if (ty === T.HILL && cold) ty = T.SNOW;
      t[i] = ty;
    }
    // drop lone single-tile specks of biome noise
    for (const i of landIdx) {
      const ty = t[i];
      if (ty === T.GRASS || ty === T.MOUNT || ty === T.SNOWMT || ty === T.BEACH) continue;
      const n = nb4(i).map((j) => t[j]);
      if (!n.includes(ty)) { const c = n.filter((x) => WALK[x]); if (c.length) t[i] = c[Math.floor(rng() * c.length)]; }
    }

    const bdir = new Uint8Array(NN);
    // ---- connected components of walkable land ----
    function components() {
      const comp = new Int32Array(NN).fill(-1), sizes = [];
      const q = new Int32Array(NN);
      for (let s = 0; s < NN; s++) {

        if (t[j] === T.BRIDGE && (world.bdir[j] === 0) !== (dx !== 0)) continue;

    const key = el.id;
    const outEl = document.getElementById(key + "-out");
    const show = () => { if (outEl && fmt[key]) outEl.textContent = fmt[key](el.value); };
    el.value = P[key];
    show();
    el.addEventListener("input", () => {
      P[key] = parseFloat(el.value);
      show();
      if (regenKeys.has(key)) { clearTimeout(regenTimer); regenTimer = setTimeout(buildWorld, 150); }
      else if (key === "party") rebuildParty();
      else if (key === "rows") setResolution();
    });
  });
  $("#size").addEventListener("change", (e) => { P.size = parseInt(e.target.value, 10); buildWorld(); });
  $("#seed").value = P.seed;
  $("#seed").addEventListener("change", (e) => { P.seed = parseInt(e.target.value, 10) || 0; buildWorld(); });
  $("#newMap").addEventListener("click", () => {
    P.seed = Math.floor(Math.random() * 1e6);
    $("#seed").value = P.seed;
    buildWorld();
  });
  $("#fade").checked = P.fade;
  $("#fade").addEventListener("change", (e) => { P.fade = e.target.checked; });
  $("#anim").checked = P.anim;
  $("#anim").addEventListener("change", (e) => { P.anim = e.target.checked; });

  const COLOR_KEYS = ["hair", "skin", "cloth", "capeC", "hat", "boots"];
  const presetSel = $("#preset");
  Object.entries(PRESETS).forEach(([k, v]) => { const o = document.createElement("option"); o.value = k; o.textContent = v.name; presetSel.appendChild(o); });
  function syncLookUI() {
    presetSel.value = LOOK.preset;
    $("#head").value = LOOK.head;
    $("#cape").checked = LOOK.cape;
    COLOR_KEYS.forEach((k) => { $("#c-" + k).value = LOOK[k]; });
  }
  presetSel.addEventListener("change", () => { Object.assign(LOOK, PRESETS[presetSel.value], { preset: presetSel.value }); syncLookUI(); rebuildParty(); });
  $("#head").addEventListener("change", (e) => { LOOK.head = e.target.value; rebuildParty(); });
  $("#cape").addEventListener("change", (e) => { LOOK.cape = e.target.checked; rebuildParty(); });
  COLOR_KEYS.forEach((k) => $("#c-" + k).addEventListener("input", (e) => { LOOK[k] = e.target.value; rebuildParty(); }));
  $("#randomHero").addEventListener("click", () => {
    const hsl = (h, s, l) => {
      s /= 100; l /= 100;
      const f = (n) => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
      return "#" + [f(0), f(8), f(4)].map((v) => v.toString(16).padStart(2, "0")).join("");
    };
    const r = Math.random;
    LOOK.hair = hsl(r() * 50, 30 + r() * 50, 10 + r() * 60);
    LOOK.skin = hsl(20 + r() * 15, 45 + r() * 30, 50 + r() * 30);
    LOOK.cloth = hsl(r() * 360, 45 + r() * 40, 35 + r() * 25);
    LOOK.capeC = hsl(r() * 360, 50 + r() * 40, 30 + r() * 25);
    LOOK.hat = hsl(r() * 360, 20 + r() * 50, 40 + r() * 35);
    LOOK.boots = hsl(20 + r() * 20, 30 + r() * 30, 15 + r() * 25);
    syncLookUI(); rebuildParty();
  });
  $("#sheetFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        if (img.height < 4) { status("画像が小さすぎます。縦4段に並べた画像を選んでください。"); return; }
        sheetImg = img;
        heroSheet = sheetCharacter(img, parseInt($("#sheetCols").value, 10));
        $("#sheetReset").hidden = false;
        rebuildParty();
        status(`主人公の画像を読み込みました（1コマ ${heroSheet.w}×${heroSheet.h}・${heroSheet.frames[0].length}コマ）。`);
      };
      img.onerror = () => status("この画像は読み込めませんでした。PNGを選んでください。");
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    e.target.value = "";
  });
  $("#sheetReset").addEventListener("click", () => { heroSheet = sheetImg = null; $("#sheetReset").hidden = true; rebuildParty(); });
  $("#sheetCols").addEventListener("change", () => {
    if (!sheetImg) return;
    heroSheet = sheetCharacter(sheetImg, parseInt($("#sheetCols").value, 10));
    rebuildParty();
  });

  let paused = false;
  $("#pause").addEventListener("click", () => {
    paused = !paused;
    $("#pause").textContent = paused ? "再開" : "一時停止";
  });
  $("#res").addEventListener("change", setResolution);

  // ---------- recording ----------
  let recorder = null, chunks = [], recStart = 0, lastBlob = null, lastMime = "";
  const downloadsP = window.claude && typeof window.claude.use === "function" ? window.claude.use("downloads") : Promise.resolve(null);
  function pickMime() {
    if (!window.MediaRecorder) return null;
    const list = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
    return list.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  }
  function bitrate() {
    const [w, h] = $("#res").value.split("x").map(Number);
    return Math.round(w * h * 9);
  }
  function startRec() {
    const mime = pickMime();
    if (mime === null || !canvas.captureStream) { status("このブラウザは画面の録画に対応していません。ChromeかFirefoxで開いてください。"); return; }
    const stream = canvas.captureStream(parseInt($("#fps").value, 10));
    chunks = [];
    try {
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: bitrate() } : { videoBitsPerSecond: bitrate() });
    } catch (e) { status("録画を開始できませんでした：" + e.message); return; }
    lastMime = recorder.mimeType || mime || "video/webm";
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      lastBlob = new Blob(chunks, { type: lastMime.split(";")[0] });
      const mb = (lastBlob.size / 1048576).toFixed(1);
      $("#save").hidden = false;
      $("#save").textContent = `動画を保存（${mb} MB）`;
      status("録画が終わりました。「動画を保存」で書き出せます。");
    };
    recorder.start(1000);
    recStart = performance.now();
    $("#rec").textContent = "録画を停止";
    $("#rec").classList.remove("primary");
    $("#rec").classList.add("recording");
    $("#res").disabled = $("#fps").disabled = $("#rows").disabled = true;
    $("#save").hidden = true;
    status("録画中です。このタブを表示したままにしてください（裏に回すと映像が止まります）。");
  }
  function stopRec() {
    if (!recorder) return;
    recorder.stop();
    recorder = null;
    $("#rec").textContent = "録画を開始";
    $("#rec").classList.add("primary");
    $("#rec").classList.remove("recording");
    $("#res").disabled = $("#fps").disabled = $("#rows").disabled = false;
  }
  $("#rec").addEventListener("click", () => (recorder ? stopRec() : startRec()));
  document.addEventListener("visibilitychange", () => {
    if (recorder && document.hidden) status("タブが裏に回ったため、その間の映像は止まっています。");
  });
  $("#save").addEventListener("click", async () => {
    if (!lastBlob) return;
    const ext = lastMime.includes("mp4") ? "mp4" : "webm";
    const d = new Date(), z = (n) => String(n).padStart(2, "0");
    const name = `world-walk-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.${ext}`;
    const dl = await downloadsP;
    if (dl) {
      try {
        await dl.save({ filename: name, data: lastBlob });
        status("保存しました：" + name);
      } catch (e) {
        const code = e && e.code;
        if (code === "declined") status("保存を取りやめました。");
        else if (code === "too_large") status("ファイルが大きすぎて保存できませんでした。録画を短くするか、解像度を下げてください。");
        else if (code === "rate_limited") status("保存の確認画面がすでに開いています。そちらを閉じてからもう一度押してください。");
        else status("この表示では保存できません。");
      }
      return;
    }
    if (window.claude) { status("この表示では保存できません。"); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(lastBlob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    status("保存しました：" + name);
  });

  // ---------- loop ----------
  let last = performance.now(), clock = 0, mmT = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!paused) { clock += dt * 1000; if (world) stepParty(dt); }
    if (world) render(clock);
    drawPreview(now);
    if (now - mmT > 100) { drawMinimap(now); mmT = now; }
    if (recorder) {
      const el = (now - recStart) / 1000;
      $("#timer").textContent = Math.floor(el / 60) + ":" + String(Math.floor(el % 60)).padStart(2, "0");
      const dur = parseFloat($("#duration").value) || 0;
      if (dur > 0 && el >= dur) stopRec();
    }
    requestAnimationFrame(frame);
  }

  // ---------- init ----------
  syncLookUI();
  rebuildParty();
  setResolution();
  buildWorld();
  requestAnimationFrame(frame);
  window.__ww = { P, W, T, PRESETS, buildCharacter, getTile, get world() { return world; } };
})();
</script>
</body>
</html>
